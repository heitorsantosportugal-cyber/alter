

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080710">
  <title>ALTER — Beyond Reality</title>

  <style>
    :root {
      --accent: #a78bfa;
      --glow: #8b5cf6;
      --background: #080710;
      --text: #f5f3ff;
      --muted: #9691ac;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--background);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      transition: background 0.8s, color 0.5s;
    }

    body.overdrive {
      --accent: #63f3ff;
      --glow: #0077ff;
      --background: #020b15;
    }

    #universe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 30px 7%;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 7px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--glow);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 50px 0;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 5px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(44px, 8vw, 92px);
      font-weight: 900;
      letter-spacing: clamp(7px, 2vw, 20px);
      padding-left: clamp(7px, 2vw, 20px);
      line-height: 1;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 2px;
      margin-top: 19px;
    }

    .scene {
      position: relative;
      width: min(310px, 75vw);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin: 25px 0;
    }

    .ring {
      position: absolute;
      width: 100%;
      height: 36%;
      border: 1px solid #a78bfa45;
      border-radius: 50%;
      transform: rotate(-28deg);
      transition: border-color 0.6s, transform 0.8s;
    }

    .ring.two {
      width: 110%;
      height: 48%;
      transform: rotate(55deg);
      border-color: #a78bfa30;
    }

    .ring.three {
      width: 85%;
      height: 85%;
      border-color: #a78bfa20;
      transform: rotate(0deg);
    }

    .orb {
      position: relative;
      width: 47%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 25%, #ffffff, transparent 9%),
        radial-gradient(circle at 35% 30%, #e8dfff, #a78bfa 18%, #6d28d9 48%, #180b35 78%);
      box-shadow:
        inset -22px -20px 45px #0009,
        inset 12px 10px 25px #ffffff30,
        0 0 35px #8b5cf660,
        0 0 85px #8b5cf630;
      animation: float 4s ease-in-out infinite,
                 breathe 3s ease-in-out infinite;
      transition: border-radius 0.6s, box-shadow 0.6s, filter 0.6s;
    }

    .orb::before,
    .orb::after {
      content: "";
      position: absolute;
      inset: -12%;
      border: 1px solid #c4b5fd80;
      border-radius: 50%;
      transform: rotateX(65deg) rotateZ(-25deg);
    }

    .orb::after {
      inset: -22%;
      border-color: #a78bfa50;
      transform: rotateX(65deg) rotateZ(65deg);
    }

    /* OVERDRIVE: energia elétrica */
    body.overdrive .orb {
      border-radius: 46% 54% 48% 52% / 52% 43% 57% 48%;
      filter: hue-rotate(155deg) saturate(1.9);
      box-shadow:
        inset -25px -20px 55px #000,
        inset 12px 10px 35px #b8fbff50,
        0 0 35px #00bfff,
        0 0 85px #0077ff,
        0 0 150px #004dff70;
      animation: float 2.2s ease-in-out infinite,
                 breathe 1.2s ease-in-out infinite;
    }

    body.overdrive .ring {
      border-color: #63f3ff80;
    }

    body.overdrive .ring.two {
      border-color: #258bff90;
    }

    body.overdrive .ring.three {
      border-color: #63f3ff35;
    }

    .scene-label {
      color: var(--accent);
      font-size: 10px;
      letter-spacing: 3px;
      margin-bottom: 27px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
      padding: 15px 22px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      transition: transform 0.2s, background 0.3s, box-shadow 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .primary {
      border: 0;
      color: #080710;
      background: linear-gradient(110deg, #c4b5fd, #8b5cf6);
      box-shadow: 0 0 30px #8b5cf630;
    }

    body.overdrive .primary {
      background: linear-gradient(110deg, #0077ff, #00d9ff);
      box-shadow: 0 0 30px #00bfff50;
    }

    .secondary {
      color: var(--text);
      background: #ffffff08;
      border: 1px solid #ffffff25;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 2px;
    }

    .counter {
      color: var(--accent);
    }

    .burst {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
      transform: translate(0, 0);
      opacity: 1;
      transition:
        transform 900ms cubic-bezier(.1,.7,.2,1),
        opacity 900ms ease;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes breathe {
      0%, 100% { scale: 1; }
      50% { scale: 1.045; }
    }

    @media (max-width: 520px) {
      .app { padding: 24px 6%; }
      .logo { letter-spacing: 4px; }
      .status { font-size: 8px; letter-spacing: 1px; }
      footer { font-size: 8px; }
      button { padding: 14px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <canvas id="universe"></canvas>

  <div class="app">
    <header>
      <div class="logo">ALTER</div>
      <div class="status">
        <span class="status-dot"></span>
        <span id="systemStatus">SYSTEM ONLINE</span>
      </div>
    </header>

    <main>
      <div class="eyebrow">REALITY IS ONLY A BEGINNING</div>
      <h1>ALTER</h1>
      <p class="subtitle">Change the state. Rewrite the experience.</p>

      <div class="scene">
        <div class="ring"></div>
        <div class="ring two"></div>
        <div class="ring three"></div>
        <div class="orb" id="orb"></div>
      </div>

      <div class="scene-label" id="sceneLabel">
        OBJECT 001 — DORMANT
      </div>

      <div class="controls">
        <button class="primary" id="transform">
          ✦ Transformar realidade
        </button>
        <button class="secondary" id="reset">
          ↺ Recomeçar
        </button>
      </div>
    </main>

    <footer>
      <span>ALTER EXPERIENCE</span>
      <span class="counter" id="counter">TRANSFORMATIONS: 0</span>
    </footer>
  </div>

  <script>
    const canvas = document.getElementById("universe");
    const ctx = canvas.getContext("2d");
    const transformBtn = document.getElementById("transform");
    const resetBtn = document.getElementById("reset");
    const sceneLabel = document.getElementById("sceneLabel");
    const counterLabel = document.getElementById("counter");
    const systemStatus = document.getElementById("systemStatus");

    let particles = [];
    let transformations = 0;
    let transformed = false;
    let width = 0;
    let height = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;

      particles = Array.from({ length: 100 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 2 + 0.5,
        alpha: Math.random() * 0.65 + 0.15,
        speed: Math.random() * 0.35 + 0.08
      }));
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (const p of particles) {
        p.y -= p.speed;

        if (p.y < -5) {
          p.y = height + 5;
          p.x = Math.random() * width;
        }

        if (document.body.classList.contains("overdrive")) {
          ctx.fillStyle = `rgba(99,243,255,${p.alpha})`;
        } else {
          ctx.fillStyle = `rgba(167,139,250,${p.alpha})`;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }

    function burstParticles() {
      const overdrive = document.body.classList.contains("overdrive");
      const colors = overdrive
        ? ["#63f3ff", "#0077ff", "#ffffff", "#a4eaff"]
        : ["#a78bfa", "#61d9ff", "#ff8bd8", "#ffffff"];

      const count = 100;

      for (let i = 0; i < count; i++) {
        const particle = document.createElement("div");
        const angle = Math.random() * Math.PI * 2;
        const distance = 100 + Math.random() * 260;
        const size = 2 + Math.random() * 5;
        const color = colors[Math.floor(Math.random() * colors.length)];

        particle.className = "burst";
        particle.style.left = "50%";
        particle.style.top = "50%";
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.background = color;
        particle.style.boxShadow = `0 0 12px ${color}`;

        document.body.appendChild(particle);

        requestAnimationFrame(() => {
          particle.style.transform =
            `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
          particle.style.opacity = "0";
        });

        setTimeout(() => particle.remove(), 1000);
      }
    }

    transformBtn.addEventListener("click", () => {
      transformed = !transformed;

      // Alterna entre o ALTER original e o OVERDRIVE.
      document.body.classList.toggle("overdrive", transformed);

      transformations++;

      // A explosão continua a acontecer em todos os cliques.
      burstParticles();

      sceneLabel.textContent = transformed
        ? "OBJECT 001 — OVERDRIVE"
        : "OBJECT 001 — ALTER ORIGINAL";

      systemStatus.textContent = transformed
        ? "OVERDRIVE ACTIVE"
        : "SYSTEM ONLINE";

      counterLabel.textContent =
        `TRANSFORMATIONS: ${transformations}`;

      transformBtn.textContent = transformed
        ? "✦ Regressar ao ALTER"
        : "✦ Ativar OVERDRIVE";
    });

    resetBtn.addEventListener("click", () => {
      transformed = false;
      transformations = 0;

      document.body.classList.remove("overdrive");

      sceneLabel.textContent = "OBJECT 001 — DORMANT";
      systemStatus.textContent = "SYSTEM ONLINE";
      counterLabel.textContent = "TRANSFORMATIONS: 0";
      transformBtn.textContent = "✦ Transformar realidade";
    });

    window.addEventListener("resize", resize);

    resize();
    animate();
  </script>
</body>
</html>
